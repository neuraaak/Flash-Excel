# /////////////////////////////////////////////////////////////////////
# 🔨 BUILD SYSTEM
# Defines the build backend and requirements
# /////////////////////////////////////////////////////////////////////

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# /////////////////////////////////////////////////////////////////////
# 📦 PROJECT METADATA
# Package information, version, authors, and classifiers
# /////////////////////////////////////////////////////////////////////

[project]
name = "flash-excel"
version = "1.3.1"
description = "Desktop utility that transforms Excel/CSV files through declarative presets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "Neuraaak" }]
maintainers = [{ name = "Neuraaak" }]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]

# /////////////////////////////////////////////////////////////////////
# 📚 DEPENDENCIES
# Core production dependencies for runtime
# /////////////////////////////////////////////////////////////////////

dependencies = [
    "pywebview>=5.0.0",
    "ezplog>=2.0.0,<3.0.0",
    "fastexcel>=0.11.0",
    "polars>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "xlsxwriter>=3.2.9",
]

# /////////////////////////////////////////////////////////////////////
# 🧰 DEPENDENCY GROUPS (PEP 735)
# Development tooling only. These are groups rather than
# [project.optional-dependencies] because none of them is a product extra:
# flash-excel ships as an installer, so nothing here belongs in the wheel
# metadata and `pip install flash-excel[dev]` is not a valid command.
# Install with `uv sync` (the dev group is synced by default) or
# `uv sync --group test` for the test tooling alone.
# /////////////////////////////////////////////////////////////////////

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "import-linter>=2.0.0",
    "grimp>=2.3.0",
]
dev = [
    # Tests (single source of truth, no duplication)
    { include-group = "test" },

    # Development tools
    "ruff>=0.1.0",
    "ty>=0.0.13",
    "pyright>=1.1.0",
    "pre-commit>=3.0.0",

    # Security
    "bandit>=1.7.0",

    # Build and distribution
    "build>=1.0.0",
    "twine>=4.0.0",
    # "ezcompiler[pyinstaller,tufup,r2]>=4.0.0,<5.0.0",
    "ezcompiler[pyinstaller,tufup,r2] @ git+https://github.com/neuraaak/ezcompiler.git@feat/publish-cli",
]

# /////////////////////////////////////////////////////////////////////
# 🔗 PROJECT URLS
# Links to repository, documentation, and package index
# /////////////////////////////////////////////////////////////////////

[project.urls]
Homepage = "https://github.com/neuraaak/flash-excel"
Repository = "https://github.com/neuraaak/flash-excel"
Issues = "https://github.com/neuraaak/flash-excel/issues"
Releases = "https://github.com/neuraaak/flash-excel/releases"

# /////////////////////////////////////////////////////////////////////
# 🖥️ SCRIPTS
# Entry points for command-line tools
# ///////////////////////////////////////////////////////////////

# [project.scripts]
# "{{my_project}}" = "{{my_project}}.module:main"

# /////////////////////////////////////////////////////////////////////
# 📦 COMPILER CONFIGURATION
# ezcompiler settings for building and distributing the application
# /////////////////////////////////////////////////////////////////////

# ezcompiler schema >= 4.0.0: nested sections (compilation / advanced /
# upload / release / installer + one section per compiler).
# [project] supplies project_name, version, description and author automatically.
[tool.ezcompiler]
main_file = "main.py"
output_folder = "dist/Flash-Excel"
icon = "bin/assets/images/logo.ico"
# bin/config dropped: the config templates live in the package
# (src/flash_excel/assets/config), are picked up by collect-data, and are
# materialised into %APPDATA% on first start.
# bin/presets excluded: machine-local user data, now under Documents.
# bin/tufup dropped: a leftover. The TUF trust anchor is root.json, generated
# by UpdaterService at the project root and bundled at the archive root
# (update.py reads sys._MEIPASS/root.json); the metadata/targets cache lives
# in %LOCALAPPDATA% (settings.py CACHE_DIR). Nothing read that folder, and its
# absence made PyInstaller fail.
include_files = { files = [], folders = ["bin/assets"] }
packages = []
includes = []
excludes = ["tkinter", "unittest", "xmlrpc", "pydoc", "doctest"]

[tool.ezcompiler.advanced]
debug = false

[tool.ezcompiler.compilation]
console = false
compiler = "PyInstaller"

# PyInstaller-specific options (replacing the old [compiler_options]).
# optimize/strip now live here; the other keys are passed through to the
# PyInstaller adapter as-is.
[tool.ezcompiler.pyinstaller]
optimize = true
strip = false
onefile = false                   # Folder mode (onedir) - no single .exe
contents-directory = "."          # Disables _internal: everything flat in dist/
collect-all = ["webview", "fastexcel"]  # Collects every pywebview asset/hook + the fastexcel Rust backend
collect-data = "flash_excel"      # Collects the package data (web/, assets...)
exclude-module = "webview.platforms.android"  # No Android module on Windows

# TUF update channel pushed to Cloudflare R2.
#   repo_endpoint   = "<bucket>/<prefix>" (objects under repository/flash-excel/)
#   repo_public_url = public base served by the custom domain (read
#                     unauthenticated by the tufup client) - MUST include the prefix.
# Upload credentials come from env vars (R2_ACCOUNT_ID/R2_ACCESS_KEY_ID/
# R2_SECRET_ACCESS_KEY), never from this file.
# release_destination = disk: the installer zip is not pushed to R2.
[tool.ezcompiler.upload]
repo_destination = "r2"
repo_endpoint = "repository/flash-excel"
repo_public_url = "https://repository.neuraaak.fr/flash-excel"
release_destination = "disk"

# Signed TUF release (tufup). Reuses the EXISTING signing keys - never
# regenerate .tufup/keys, or the auto-update of every installed client breaks.
[tool.ezcompiler.release]
tuf_enabled = true
tuf_repo_dir = ".tufup/repo"
tuf_keys_dir = ".tufup/keys"
# Lifetime (days) of the TUF metadata per role. The tufup defaults are too
# short for an irregularly published app (root=365, targets=7, snapshot=7,
# timestamp=1): clients could no longer validate the repo between two
# releases -> auto-update broken. Raised to 365 days for all four roles;
# a keep-alive between releases is possible via `ezcompiler tuf refresh`.
tuf_expiration_days = { root = 365, targets = 365, snapshot = 365, timestamp = 365 }

# Installer Inno Setup. per_user = true → installation PAR-UTILISATEUR
# (%LOCALAPPDATA%\Programs, PrivilegesRequired=lowest) au lieu de Program Files :
# required for the tufup auto-update to apply in place without an admin
# elevation. Output: dist/installer/<app>-<version>-setup.exe.
# ezcompiler schema >= 4.0.0: keys without the `installer_` prefix (the old
# ones are rejected when the config is read).
[tool.ezcompiler.installer]
enabled = true
output_dir = "dist/installer"

# Stable identity of the application in Windows (Programs and Features).
# The GUID is pinned explicitly rather than left to ezcompiler's UUIDv5
# computation: that one derives from company_name + project_name, so renaming
# the author or the project would create a second entry instead of an upgrade.
# NEVER change this value.
app_id = "{F3A2C1B4-8E5D-4F9A-B2C7-1D3E6F8A0C5B}"
publisher_url = "https://github.com/neuraaak/flash-excel"
support_url = "https://github.com/neuraaak/flash-excel/issues"
updates_url = "https://github.com/neuraaak/flash-excel/releases"
architecture = "x64"

# Install PAR-UTILISATEUR (%LOCALAPPDATA%\Programs, PrivilegesRequired=lowest).
per_user = true

# Shortcuts and post-install (default values, spelled out for the record).
desktop_icon = true          # "desktopicon" task, unchecked by default
launch_after_install = true  # case "Lancer flash-excel" en fin d'assistant
add_to_path = false          # GUI app: no command to expose to the shell

# The app runs from its install folder: an upgrade must close the running
# instance, otherwise the .exe/.dll files stay locked.
close_running_app = true

# Nothing to clean in {app}: since 1.3.0 the application no longer writes
# there. The settings (%APPDATA%) and presets (Documents) are user data and
# deliberately survive an uninstall; ezcompiler would reject a path outside
# {app} anyway.
uninstall_delete = []

# UX de l'assistant.
languages = ["french", "english"]
license_file = "LICENSE"
wizard_style = "modern"
compression = "lzma2/ultra64"

# Inno directives with no typed field in ezcompiler (a raw escape hatch; a key
# colliding with a typed field is rejected when the config is read).
[tool.ezcompiler.installer.extra_setup_directives]
# Laisse l'utilisateur basculer en install machine-wide depuis l'assistant.
PrivilegesRequiredOverridesAllowed = "dialog"
# Icon shown in "Programs and Features".
UninstallDisplayIcon = "{app}\\flash-excel.exe"
# No system component is touched: never ask for a reboot.
RestartIfNeededByRun = "no"

# Inno sections with no typed field in ezcompiler. This is how the language
# picked in the wizard becomes the app's initial language: Inno writes
# {language} into %APPDATA%\flash-excel\installer.ini, which the app reads
# exactly once, when creating its config (the user setting wins afterwards).
# It targets %APPDATA% and not {app}: that is where app.config.yaml lives, and
# the install folder is replaced on every auto-update.
# [Dirs] is required, [INI] does not create missing folders.
[tool.ezcompiler.installer.extra_sections]
Dirs = ['Name: "{userappdata}\flash-excel"']
INI = [
    'Filename: "{userappdata}\flash-excel\installer.ini"; Section: "Setup"; Key: "Language"; String: "{language}"',
]

# /////////////////////////////////////////////////////////////////////
# 🎨 CODE FORMATTING & LINTING TOOLS
# Auto-formatting, import sorting, and style checking
# /////////////////////////////////////////////////////////////////////

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort-compatible import sorting (via ruff)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit security
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long, handled by ruff format
    "B008", # do not perform function calls in argument defaults
    "S101", # assert_used (for tests)
    "S106", # hardcoded_password_funcarg
    "T201", # print statements (for init.py and scripts)
    "S603", # subprocess.run without check=True
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S311", "E501", "ARG002"]
"examples/**/*" = ["T201", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# /////////////////////////////////////////////////////////////////////
# ✅ TYPE CHECKING TOOLS
# Static type analysis with minimal and comprehensive modes
# /////////////////////////////////////////////////////////////////////

# ty: Type checking with minimal configuration
[tool.ty.environment]
python-version = "3.13"
root = ["src", "src/flash_excel"]

[tool.ty.src]
include = ["src/flash_excel/**/*.py"]
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "tests",
    "docs",
    "examples",
]

# Respect .gitignore
respect-ignore-files = true

[tool.ty.terminal]
output-format = "full"
error-on-warning = false

# Pyright: Comprehensive type checking with detailed reporting
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

# Include/exclude paths
include = ["src/flash_excel"]
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "tests",
    "docs",
    "examples",
    "**/node_modules",
    "**/.*",
]

# Reporting rules: flag missing imports and duplicates
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true

# Optional type checking (None safety)
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true

# Tolerance for decorators and complex types
reportUntypedFunctionDecorator = false
reportUntypedClassDecorator = false
reportUntypedBaseClass = false
reportUntypedNamedTuple = false

# Override and consistency checks
reportPrivateUsage = false
reportConstantRedefinition = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInconsistentConstructor = true

# /////////////////////////////////////////////////////////////////////
# 🧭 IMPORT LINTER CONTRACTS
# Layer dependency contracts enforced in CI
# ///////////////////////////////////////////////////////////////

[tool.importlinter]
root_packages = ["flash_excel"]
# Note: import-linter 2.x does not support source_paths (feature pending PR #323).
# The package must be installed in editable mode (pip install -e .)
# or run as PYTHONPATH=src lint-imports

# Real layers, from the top (depends) down to the bottom (depended upon). An
# empty contract always passed: it declared an architecture without ever
# checking it. `a : b` = independent siblings (neither may import the other).
[[tool.importlinter.contracts]]
name = "layer dependency flow"
type = "layers"
layers = [
    "flash_excel.ui",
    "flash_excel.presets : flash_excel.io",
    "flash_excel.core",
    "flash_excel.migration",
    "flash_excel.config",
    "flash_excel.logs",
    "flash_excel.paths",
]

# ///////////////////////////////////////////////////////////////
# 🧪 TESTING & COVERAGE TOOLS
# Test execution, coverage analysis, and test configuration
# /////////////////////////////////////////////////////////////////////

# Pytest: Test runner with markers and coverage configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/flash_excel",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70",
    "--tb=short",
    "--color=yes",
    "--durations=10",
    "--maxfail=5",
]
console_output_style = "progress"
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "robustness: marks tests as robustness tests",
    "unit: marks tests as unit tests (default)",
    "cli: marks tests related to CLI",
    "smoke: marks tests as smoke tests (app/entrypoint startup checks)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/flash_excel"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.pytest_cache/*",
    "*/.benchmarks/*",
    "*/.vscode/*",
    "*/.egg-info/*",
    "*/.hooks/*",
    "setup.py",
    "build/*",
    "dist/*",
    ".venv/*",
    "venv/*",
    "htmlcov/*",
    "coverage.xml",
    ".coverage",
    "docs/*",
    "examples/*",
    "_temp/*",
]

[tool.coverage.report]
# Lines to exclude: comments, abstractions, unreachable code
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if platform.system\\(\\) == \"Windows\":",
    "except ImportError:",
]
show_missing = true
precision = 2
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"

# ///////////////////////////////////////////////////////////////
# 🔒 SECURITY TOOLS
# Code security scanning and vulnerability detection
# ///////////////////////////////////////////////////////////////

# Bandit: Security linter for identifying common security issues
[tool.bandit]
exclude_dirs = [
    "tests",
    "build",
    "dist",
    "venv",
    ".venv",
    ".hooks",
    "docs",
    "examples",
    ".tmp",
    "_temp",
]
skips = ["B101", "B601"]
