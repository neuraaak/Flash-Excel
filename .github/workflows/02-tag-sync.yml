name: 02 · Tag Sync

# Release orchestrator. On push to main it runs CI as the release gate, decides
# a three-state `tag_action` (create | skip | preview) and creates the immutable
# release tag on `create`.
#
# The cascade stops here: flash-excel is a Windows desktop app, not a published
# package. Build, TUF signing and upload run locally via `build.py`, because the
# signing keys are deliberately never uploaded as CI secrets.

on:
  push:
    branches: [main]
  workflow_dispatch: # run from any branch to exercise preview mode

permissions:
  contents: read

concurrency:
  group: tag-sync-${{ github.ref }}
  cancel-in-progress: false # never interrupt an in-flight release

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/01-ci.yml

  tag-sync:
    name: Tag sync
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push tags
    outputs:
      tag_action: ${{ steps.gate.outputs.tag_action }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.gate.outputs.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: need every tag

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      # `poe -q read-version` is the single source: nothing here re-implements
      # a grep/sed over pyproject.toml.
      - name: Resolve version
        id: version
        run: |
          VERSION=$(uv run --frozen poe -q read-version)
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in pyproject.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Determine tag action
        id: gate
        run: |
          TAG_NAME="v${{ steps.version.outputs.version }}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "tag_action=preview" >> "$GITHUB_OUTPUT"
            echo "🔎 Off main → preview (dry-run, nothing mutating)"
          elif git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "tag_action=skip" >> "$GITHUB_OUTPUT"
            echo "⏭️  $TAG_NAME already exists → skip (already released)"
          else
            echo "tag_action=create" >> "$GITHUB_OUTPUT"
            echo "✅ New version → create $TAG_NAME"
          fi

      - name: Configure git
        if: steps.gate.outputs.tag_action == 'create'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create tag & move alias
        if: steps.gate.outputs.tag_action == 'create'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR="${VERSION%%.*}"
          LATEST_TAG="v${MAJOR}-latest"
          git tag "v$VERSION"                 # immutable: never force-pushed
          git push origin "v$VERSION"
          git tag -f "$LATEST_TAG"            # only the major alias ever moves
          git push origin --force "$LATEST_TAG"
          echo "✅ Tags pushed: v$VERSION, $LATEST_TAG"

      - name: Summary
        run: |
          echo "## 🏷️ Tag Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Action**: ${{ steps.gate.outputs.tag_action }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: ${{ steps.gate.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
