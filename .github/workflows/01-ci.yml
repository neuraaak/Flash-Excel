name: CI

# Runs on PRs, and as the release gate via workflow_call from 02-tag-sync
# (no bare `push` trigger → one CI run per change, no double runs).

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-deps:
    permissions:
      contents: read
    uses: ./.github/workflows/00-install-deps.yml

  quality:
    name: Lint, Format, Type Check, Security
    needs: [install-deps]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint (ruff check)
        run: uv run --frozen ruff check .

      - name: Format check (ruff format)
        run: uv run --frozen ruff format --check .

      - name: Type check (ty)
        run: uv run --frozen ty check

      - name: Security scan (bandit)
        run: uv run --frozen bandit -r src/ -ll

      - name: Import contracts (import-linter)
        run: uv run --frozen lint-imports

  test:
    name: Test
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run --frozen pytest --cov=src/ --cov-report=xml -q
