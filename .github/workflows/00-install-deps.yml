name: 00 · Install Deps

# Logic-free cache primer: warms the uv download cache (keyed on uv.lock by
# setup-uv) so every downstream job that repeats `uv sync` gets a cache hit
# instead of a network resolve. Called via workflow_call by 01-ci and others.

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.13"

permissions: {}

jobs:
  install:
    name: Install & cache deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
