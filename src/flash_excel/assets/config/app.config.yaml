# ///////////////////////////////////////////////////////////////
# Flash-Excel — Configuration utilisateur
# This file is managed automatically by the application.
# You may edit it by hand; the changes are picked up on the
# next start.
# ///////////////////////////////////////////////////////////////

# //////
# Apparence
appearance:
  # Palette de couleurs active.
  # Valeurs disponibles : blue-gray | github-dark | warm-dark
  palette: "{palette}"

  # Mode d'affichage.
  # Valeurs disponibles : dark | light
  mode: "{mode}"

# //////
# Langue
# Valeurs disponibles : en | fr
locale: "{locale}"

# //////
# CSV
# Applies to the files the application writes. "auto" follows the Windows
# regional settings — the same ones Excel reads, so an "auto" file opens in
# columns on a double-click.
csv:
  # Column delimiter.
  # Available values: auto | semicolon | comma | tab
  separator: "{csv_separator}"

  # Decimal mark of numeric columns.
  # Available values: auto | comma | dot
  decimal: "{csv_decimal}"
